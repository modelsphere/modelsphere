# The Gateway's HTTPS listener takes its certificate from a Secret in THIS
# namespace, and the ReferenceGrant next to it lives here too -- so on a cluster
# that does not have it yet, `kubectl apply -f gateway-api/openresty/` fails
# halfway with `namespaces "gateway-secrets" not found` and leaves the
# ReferenceGrant uncreated. Measured on a fresh cluster.
#
# The namespace ships here; the certificate itself does not. It is the site's
# own -- `wildcard-example-com` in gateway-openresty.yaml is a wildcard for one
# organisation -- so create it with the site's key material:
#
#   kubectl -n gateway-secrets create secret tls wildcard-example-com \
#     --cert=<fullchain.pem> --key=<privkey.pem>
#
# Until it exists, the https listener stays ResolvedRefs=False and the http one
# serves normally; a cluster that exposes only http needs nothing further.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-secrets
