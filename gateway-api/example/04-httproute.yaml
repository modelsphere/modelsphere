apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: modelforge-fallback
  namespace: modelforge
spec:
  parentRefs:
  - name: modelforge
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: modelforge-fallback-sglang-svc
      port: 8050
