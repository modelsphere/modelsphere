apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
  - name: gateway-infra
    namespace: monitoring
  hostnames:
  # Replace with your actual domain, e.g., grafana.inference.local
  - "grafana.modelsphere.dev"
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-grafana
      port: 80

