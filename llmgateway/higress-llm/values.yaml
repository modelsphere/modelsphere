# Filled in by ../higress-llm.yaml.gotmpl from environments/*.yaml (`higress:`);
# the comments there describe each field. Defaults here only make the chart
# render on its own (`helm template`). Models and consumers are not here: they are
# ModelFleet and APIConsumer objects, written into the gateway by autoconfig.
globalAuth: false
backendRouter:
  spill: true
  maxRequestBodyBytes: 16777216
plugins:
  modelRouter: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/model-router:2.0.4
  keyAuth: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/key-auth:2.0.0
  aiStatistics: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/ai-statistics:2.0.3
  aiProxy: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/ai-proxy:2.0.4
  aiBackendRouter: oci://modelsphere.tencentcloudcr.com/4pdosc/higress-plugin-ai-backend-router:1.0.0
