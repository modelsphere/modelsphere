USER-SUPPLIED VALUES:
cluster:
  name: kubernetes
# updateStrategy:
#   type: RollingUpdate
#   rollingUpdate:
#     maxUnavailable: 1
gatewayAPI:
  enabled: true
hubble:
  enabled: true
  metrics:
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    enabled:
    - dns
    - drop
    - tcp
    - flow
    - port-distribution
    - icmp
    - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
  relay:
    enabled: true
  ui:
    enabled: false
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: 192.168.0.0/16
k8sServiceHost: cluster-control-plane.lan
k8sServicePort: 6443
kubeProxyReplacement: true
operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
  replicas: 1
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
routingMode: tunnel
tunnelProtocol: vxlan

envoy:
  streamIdleTimeoutDurationSeconds: 600
  idleTimeoutDurationSeconds: 300          # upstream conn reuse; safe to raise
  clusterMaxConnections: 40000
  clusterMaxRequests: 40000
  clusterMaxPendingRequests: 8000
  # maxConcurrentRetries: 128
  log:
    accessLogBufferSize: 65536
  # terminationGracePeriodSeconds: 600
  # updateStrategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxUnavailable: 1
  prometheus:
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack

