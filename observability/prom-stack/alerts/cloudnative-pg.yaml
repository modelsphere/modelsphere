# CloudNativePG(middleware ns 的共享 PostgreSQL)告警规则。
#
# 指标名和标签都是在生产 Prometheus 上【实测确认】过的,不是照文档抄的 ——
# 下面每条 expr 用到的 series 当时都能查到数据。
#
# ⚠️ metadata.labels 必须带 release: kube-prometheus-stack ——
#    本集群 Prometheus 的 ruleSelector 是 matchLabels{release: kube-prometheus-stack},
#    缺了会被【静默忽略】:kubectl get 看得到,Prometheus 不加载。
#    apply 后去 Prometheus /rules 页面确认,别只看 kubectl。
#
# channel: infra —— 数据库属于承载业务的基础设施,收的人是能处理它的人。
#
# ── 为什么是这几条:每一条都对应一个【真实发生过且当时没人发现】的故障 ──
#
# CNPGWALArchiveFailing / Backlog 这两条最重要。2026-09-07 在测试集群踩到:
#   同名 Cluster 重建后指向同一个桶,barman 要求首次归档时目的地为空,否则
#   **永久拒绝归档**(Expected empty archive)。表现极其隐蔽 ——
#   Cluster 仍是 Ready=True、三个 Pod 全绿、业务读写完全正常,
#   只有 ContinuousArchiving 这一个 condition 是 False;
#   而 WAL 只出不进,本地 WAL 盘一路涨(实测 45% 且持续上升),写满 = PostgreSQL 停止写入。
#   光看 Pod 和 Cluster 状态永远发现不了,必须盯 archiver 的失败计数和 ready 积压。
#
# ── 已知缺口:没有"备份过期"告警 ──
#   cnpg_collector_last_available_backup_timestamp 恒为 0 —— 那是 in-tree 备份的指标,
#   不认 barman-cloud 插件做的备份(实测:刚跑完一次 completed 的基础备份,它仍是 0)。
#   用它写规则会【永远误报】。要覆盖这一项得另找数据源(如把 Backup CR 接进
#   kube-state-metrics 的 custom resource metrics),暂缺。
#   在此之前,备份是否还在做,靠 ScheduledBackup 的 lastScheduleTime 人工看。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cloudnative-pg.rules
      interval: 30s
      rules:

        # ---------------- 可用性 ----------------
        - alert: CNPGInstanceDown
          expr: cnpg_collector_up == 0
          for: 5m
          labels: {severity: critical, channel: infra}
          annotations:
            summary: "CNPG 实例 {{ $labels.pod }} 采集不到(cluster={{ $labels.cluster }})"
            description: "cnpg_collector_up=0 持续 5 分钟。实例可能已崩溃或无法连接。"

        # 实例数少于 3 = 少了副本。Pod 消失时 series 也会消失,所以用 count 而不是比较值。
        - alert: CNPGClusterDegraded
          expr: count by (cluster) (cnpg_collector_up == 1) < 3
          for: 10m
          labels: {severity: critical, channel: infra}
          annotations:
            summary: "CNPG 集群 {{ $labels.cluster }} 只剩 {{ $value }} 个实例(应为 3)"
            description: "少于 3 个实例时,再挂一台就可能没有可提升的备库。"

        # streaming_replicas 只有主库那条 series 有意义(备库上恒为 0),所以取 max。
        - alert: CNPGNoStreamingReplica
          expr: max by (cluster) (cnpg_pg_replication_streaming_replicas) < 2
          for: 10m
          labels: {severity: warning, channel: infra}
          annotations:
            summary: "CNPG {{ $labels.cluster }} 的流复制副本只剩 {{ $value }} 个"
            description: "备库没在跟上主库。此时故障转移会丢数据或无法进行。"

        # ---------------- WAL 归档(最隐蔽的一类故障)----------------
        - alert: CNPGWALArchiveFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count[15m]) > 0
          for: 5m
          labels: {severity: critical, channel: infra}
          annotations:
            summary: "CNPG {{ $labels.pod }} 的 WAL 归档正在失败"
            description: >-
              15 分钟内 failed_count 有增长。WAL 归档断了 = PITR 链断了,而且 WAL
              只出不进会把本地 WAL 盘撑满,写满即数据库停止写入。
              注意此时 Cluster 很可能仍显示 Ready=True、Pod 全绿。
              排查:kubectl -n middleware get cluster <c> -o json | 看 ContinuousArchiving 这个 condition;
              以及备份边车日志 kubectl logs <pod> -c plugin-barman-cloud。

        # 等待归档的 WAL 文件数。正常稳态是 0(实测),持续积压说明归档跟不上或已断。
        - alert: CNPGWALArchiveBacklog
          expr: max by (pod) (cnpg_collector_pg_wal_archive_status{value="ready"}) > 20
          for: 15m
          labels: {severity: critical, channel: infra}
          annotations:
            summary: "CNPG {{ $labels.pod }} 有 {{ $value }} 个 WAL 文件等待归档"
            description: "正常应为 0。持续积压意味着 WAL 盘会被逐步撑满。"

        # ⚠️ "很久没归档"本身**不一定是故障** —— 低写入的库本来就没有 WAL 可归档。
        #    实测:生产 H3 流量稀疏,1 小时阈值当场就 pending 了(误报)。
        #    所以这条必须【与 ready 积压联立】:既很久没成功归档、又确实有文件在等,
        #    才是真的断了。单看任一边都会误判。
        - alert: CNPGArchiveStalled
          expr: |
            cnpg_pg_stat_archiver_seconds_since_last_archival > 3600
            and on (pod)
            max by (pod) (cnpg_collector_pg_wal_archive_status{value="ready"}) > 0
          for: 15m
          labels: {severity: warning, channel: infra}
          annotations:
            summary: "CNPG {{ $labels.pod }} 有 WAL 待归档但已 {{ $value | humanizeDuration }} 没成功归档"
            description: "有积压 + 长时间没成功 = 归档链路真的断了,不是没数据可归档。"

        # ---------------- 磁盘 ----------------
        # 数据盘满 = PostgreSQL 直接停止写入;WAL 盘满同理。ceph-block 支持在线扩容,
        # 扩法:改 Cluster 的 spec.storage.size 再 apply,CNPG 逐个滚动扩,业务不断。
        - alert: CNPGVolumeFillingUp
          expr: |
            kubelet_volume_stats_used_bytes{persistentvolumeclaim=~"cnpg.*"}
            / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"cnpg.*"} > 0.80
          for: 15m
          labels: {severity: warning, channel: infra}
          annotations:
            summary: "CNPG 卷 {{ $labels.persistentvolumeclaim }} 已用 {{ $value | humanizePercentage }}"
            description: "在线扩容:改 Cluster 的 spec.storage.size(或 walStorage.size)后 apply。"

        - alert: CNPGVolumeAlmostFull
          expr: |
            kubelet_volume_stats_used_bytes{persistentvolumeclaim=~"cnpg.*"}
            / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"cnpg.*"} > 0.90
          for: 5m
          labels: {severity: critical, channel: infra}
          annotations:
            summary: "CNPG 卷 {{ $labels.persistentvolumeclaim }} 已用 {{ $value | humanizePercentage }},接近写满"
            description: "数据盘或 WAL 盘写满会让 PostgreSQL 立即停止写入。"

        # ---------------- 其它 ----------------
        - alert: CNPGManualSwitchoverRequired
          expr: cnpg_collector_manual_switchover_required > 0
          for: 5m
          labels: {severity: warning, channel: infra}
          annotations:
            summary: "CNPG {{ $labels.pod }} 需要人工 switchover"
            description: "operator 判定需要人工介入才能完成切换(如 primaryUpdateStrategy 为 supervised)。"

        - alert: CNPGCollectorError
          expr: cnpg_collector_last_collection_error > 0
          for: 15m
          labels: {severity: warning, channel: infra}
          annotations:
            summary: "CNPG {{ $labels.pod }} 的指标采集持续报错"
            description: "采集器出错时其余告警可能失效(指标停更 = 静默)。"
