# 自己管 PodMonitor,而不是 Cluster.spec.monitoring.enablePodMonitor —— 那个字段已废弃。
#
# release 标签不能少:集群里 Prometheus 的 podMonitorSelector 是
# matchLabels{release: kube-prometheus-stack},不带这个标签的 PodMonitor 会被
# 建出来但**永远不被抓取**,指标静默为空。
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cnpg
  podMetricsEndpoints:
    - port: metrics
