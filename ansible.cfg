[defaults]
inventory = inventory.ini

# 默认 callback 会把多行输出压成一行 \n,脚本报告根本没法读。
# ansible.posix.debug 按真实换行打印 stdout/stderr/msg —— audit 的报告靠它。
# 临时换回去:ANSIBLE_STDOUT_CALLBACK=default make audit-gpu
stdout_callback = ansible.posix.debug

# 跑 --tags audit 时 gpu-prep 的任务会整片 skip,不用刷屏
display_skipped_hosts = false

# 每个 task 的耗时,方便看是哪台机器卡住(而不是整体慢)
callbacks_enabled = ansible.posix.profile_tasks
