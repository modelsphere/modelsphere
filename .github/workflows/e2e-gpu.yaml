name: e2e-gpu

# test/e2e/gpu against an existing GPU cluster. The runner is a self-hosted
# node that can reach that cluster; the labels below are to be confirmed.
#
# workflow_dispatch only until that network exists. A daily schedule is
# written below and left commented; enable it once the runner can reach the
# cluster. Not triggered by pull_request, pull_request_target or push: a
# fork must not be able to run this.
on:
  workflow_dispatch:
  # schedule:
  #   # 02:00 UTC. Enable once the runner network is up.
  #   - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  # One cluster. Shared with e2e-gpu-infra so an infra apply and a test run
  # never overlap. A second run waits; it is not cancelled.
  group: e2e-gpu
  cancel-in-progress: false

jobs:
  e2e-gpu:
    name: e2e-gpu
    if: github.repository == 'modelsphere/modelsphere'
    # Labels to be confirmed with the runner that can reach the GPU cluster.
    runs-on: [self-hosted, gpu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: test/e2e/gpu/go.mod
          cache-dependency-path: test/e2e/gpu/go.sum
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: Install helmfile and helm-diff
        # Same pins as e2e-kind. linux/amd64, same as that runner; another
        # architecture needs its own helmfile checksum. Installed into
        # RUNNER_TEMP rather than with sudo, so a rootless runner can do it.
        env:
          HELMFILE_VERSION: "1.8.2"
          # helmfile_1.8.2_checksums.txt, linux_amd64
          HELMFILE_SHA256: f179485c5bb9f8e20fbd8ea16d8807915988aba4d60131ee864fb3232452716e
          HELM_DIFF_VERSION: v3.15.15
        run: |
          set -euo pipefail
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "$bindir"
          tgz="helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$tgz" "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/$tgz"
          echo "${HELMFILE_SHA256}  $tgz" | sha256sum -c
          tar -xzf "$tgz" helmfile
          install -m 0755 helmfile "$bindir/helmfile"
          rm -f "$tgz" helmfile
          echo "$bindir" >> "$GITHUB_PATH"
          # A self-hosted runner keeps plugins between jobs. Reinstall so the
          # pin above is the one this run actually uses.
          if helm plugin list 2>/dev/null | awk 'NR>1 {print $1}' | grep -qx diff; then
            helm plugin uninstall diff
          fi
          helm plugin install https://github.com/databus23/helm-diff --version "${HELM_DIFF_VERSION}" --verify=false
          "$bindir/helmfile" version
      - name: Prepare kubeconfig
        env:
          # A different name from KUBECONFIG, so a file path already in the
          # runner environment is not overwritten by the secret value.
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          # Do not set -x: the secret would land in the log.
          if [ -n "${KUBECONFIG:-}" ] && [ -f "${KUBECONFIG}" ]; then
            echo "Using the KUBECONFIG file from the runner environment"
            exit 0
          fi
          if [ -z "${KUBECONFIG_CONTENT}" ]; then
            echo "No kubeconfig: set KUBECONFIG to a file on the runner, or add a KUBECONFIG secret" >&2
            exit 1
          fi
          umask 077
          dir=$(mktemp -d)
          printf '%s' "$KUBECONFIG_CONTENT" > "$dir/kubeconfig"
          chmod 0600 "$dir/kubeconfig"
          echo "KUBECONFIG=$dir/kubeconfig" >> "$GITHUB_ENV"
          echo "E2E_KUBECONFIG_DIR=$dir" >> "$GITHUB_ENV"
      - name: e2e
        env:
          E2E_VERBOSE: "true"
        run: make test-e2e-gpu
      - name: Remove kubeconfig
        if: always()
        run: |
          set -euo pipefail
          # Only the directory this job created. A KUBECONFIG the runner
          # already had is left where it was.
          if [ -n "${E2E_KUBECONFIG_DIR:-}" ]; then
            rm -rf "$E2E_KUBECONFIG_DIR"
          fi
