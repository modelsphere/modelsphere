# Kind cluster for test/e2e/kind: one CPU-only control-plane node.
# kubeProxyMode iptables is kind's default and what GitHub's runners need.
# On a kernel without xt_statistic, where iptables mode cannot balance a
# Service over more than one endpoint, run with KIND_PROXY_MODE=nftables.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  kubeProxyMode: iptables
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
